# Scale to zero when idle; keep the prototype's serving capacity small.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  # This Web key is public in the browser bundle; API/referrer restrictions protect its use.
  # Secret Manager keeps the literal value out of the Git repository.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: tsugidoko-firebase-web-api-key@1
    availability:
      - BUILD
  # Reject builds if the managed runtime is older than package.json requires.
  - variable: NPM_CONFIG_ENGINE_STRICT
    value: "true"
    availability:
      - BUILD
